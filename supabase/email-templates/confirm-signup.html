<!--
  JINX — "Confirm signup" template
  NOTE: In Jinx this normally does NOT fire — users created with a password are
  auto-confirmed, and users created without one get the Invite email instead.
  Included only so the confirmation flow is on-brand if you ever enable it.
  Paste into: Supabase → Authentication → Email Templates → Confirm signup
  Suggested subject:  Confirm your Jinx account
  Variables used: {{ .ConfirmationURL }}, {{ .Data.full_name }}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d101b;padding:32px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#14182a;border:1px solid #2a3046;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:28px 32px 0 32px;">
            <span style="font-size:22px;font-weight:700;color:#e8ebf4;">⚡ Jinx</span>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0 32px;">
            <h1 style="margin:0 0 8px 0;font-size:22px;line-height:1.3;color:#e8ebf4;">Confirm your account</h1>
            <p style="margin:0;font-size:15px;line-height:1.6;color:#8a92ac;">
              Hi {{ .Data.full_name }}, please confirm your email address to activate your Jinx account.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#84cc16;color:#0c1206;text-decoration:none;font-weight:600;font-size:15px;padding:13px 28px;border-radius:12px;">
              Confirm email
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px;background:#1c2133;border-top:1px solid #2a3046;">
            <p style="margin:0;font-size:12px;color:#8a92ac;">Jinx · Trainee Work Tracker</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
